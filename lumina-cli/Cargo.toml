[package]
name = "cargo-lumina"
version = "0.1.0"
edition = "2021"
authors = ["Slamet Sugandi <packercyber@gmail.com>"]
description = "The Lumina Framework Installer"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
zip = "2.2"
indicatif = "0.17"
colored = "2"
fs_extra = "1.3"
uuid = { version = "1", features = ["v4"] }
